name: BTC Simulation

on:
  schedule:
    # JST 0:00 / 6:00 / 12:00 / 18:00 に実行（UTC表記）
    - cron: '0 15 * * *'   # JST 0:00
    - cron: '0 21 * * *'   # JST 6:00
    - cron: '0 3 * * *'    # JST 12:00
    - cron: '0 9 * * *'    # JST 18:00
  workflow_dispatch:         # 手動実行も可能

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ログをリポジトリにpushするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: シミュレーターを実行
        run: python src/simulator.py

      - name: ログをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "sim: $(date +'%Y-%m-%d %H:%M JST')"
          git push
